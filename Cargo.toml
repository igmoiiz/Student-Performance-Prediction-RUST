[package]
name = "student-performance-prediction"
version = "0.1.0"
edition = "2021"
description = "Student performance prediction with logistic regression, decision trees, a class-weighted random forest and an ensemble, built with linfa in Rust"
license = "MIT"
authors = ["Moiz Baloch"]

[dependencies]
linfa = { version = "0.7", features = ["serde"] }
linfa-logistic = { version = "0.7", features = ["serde"] }
linfa-trees = { version = "0.7", features = ["serde"] }
ndarray = { version = "0.15", features = ["serde-1"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "point_series", "histogram", "errorbar"] }
